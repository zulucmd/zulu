[tools]
go = "1.23"
"github:j178/prek" = "latest"
"github:golangci/golangci-lint" = "1.63.3"
"github:kyoh86/richgo" = "latest"
# The site theme compiles SCSS, which needs the extended Hugo build.
hugo-extended = "0.165.0"

[tasks.setup]
description = "Install the prek git hooks"
run = "prek install"

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run"

[tasks.test]
description = "Run the Go test suite"
run = "go test ./..."

[tasks.check]
description = "Run every prek hook against all files"
run = "prek run --all-files"

[tasks.fmt]
description = "Check Go formatting with gofmt"
run = '''
unformatted="$(gofmt -l .)"
if [ -n "$unformatted" ]; then
  printf '%s\n' "$unformatted" | while IFS= read -r file; do
    gofmt -d "$file"
  done
  exit 1
fi
'''

[tasks.clean]
description = "Remove build artifacts"
run = "rm -rf bin completion-integrations/testprog/bin"

[tasks.all]
description = "Check formatting and run the Go test suite"
depends = ["fmt", "test"]
