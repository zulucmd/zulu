name: Test

on:
  push:
    branches:
      - main
    paths:
      - '**.go'
      - '**.gotmpl'
      - 'go.*'
      - '.golangci.yml'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - '**.go'
      - '**.gotmpl'
      - 'go.*'
      - '.golangci.yml'
      - '.github/workflows/test.yml'

env:
  GO111MODULE: on

jobs:
  Pre-Commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/AppData/Local/go-build
            ~/go/pkg/mod
          key: go-${{ hashFiles('**/go.sum') }}
          restore-keys: go-mod
      - name: Setup mdtoc
        run: go install sigs.k8s.io/mdtoc@latest
      - uses: j178/prek-action@v3.0.0
        env:
          PREK_SKIP: golangci-lint,go-build,go-unit-tests

  GolangCI-Lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v3
        with:
          install: false
        env:
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - id: versions
        run: |
          golangci="$(mise ls 'github:golangci/golangci-lint' --current --json | jq -r '.[0].version')"
          echo "golangci=v${golangci}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/AppData/Local/go-build
            ~/go/pkg/mod
          key: go-${{ hashFiles('**/go.sum') }}
          restore-keys: go-mod
      - name: Run linters
        uses: golangci/golangci-lint-action@v6
        with:
          version: ${{ steps.versions.outputs.golangci }}

  Vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/AppData/Local/go-build
            ~/go/pkg/mod
          key: go-${{ hashFiles('**/go.sum') }}
          restore-keys: go-mod
      - name: Run vet
        run: go vet

  Test:
    runs-on: ubuntu-latest
    name: Go Tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/AppData/Local/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.go }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-mod
      - name: Run tests
        shell: bash
        run: go test -v -cover -race
