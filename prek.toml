# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

minimum_prek_version = "0.5.0"

[[repos]]
repo = "https://github.com/pre-commit/pre-commit"
rev = "v4.0.1"
hooks = [
  { id = "validate_manifest" }
]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v5.0.0"
hooks = [
  {
    id = "check-merge-conflict",
    stages = ["pre-commit"]
  },
  {
    id = "check-symlinks",
    stages = ["pre-commit"]
  },
  {
    id = "check-yaml",
    stages = ["pre-commit"]
  },
  {
    id = "end-of-file-fixer",
    stages = ["pre-commit"]
  },
  {
    id = "trailing-whitespace",
    stages = ["pre-commit"]
  },
  {
    id = "check-toml",
    stages = ["pre-commit"]
  },
  {
    id = "mixed-line-ending",
    stages = ["pre-commit"],
    args = ["--fix=no"]
  }
]

[[repos]]
repo = "https://github.com/markdownlint/markdownlint"
rev = "v0.12.0"
hooks = [
  {
    id = "markdownlint_docker",
    stages = ["pre-commit"]
  }
]

[[repos]]
repo = "local"
hooks = [
  {
    name = "golangci-lint",
    id = "golangci-lint",
    language = "system",
    entry = "golangci-lint run",
    types = ["go"],
    pass_filenames = false
  },
  {
    name = "Go Tests",
    id = "go-tests",
    language = "system",
    files = '\.go$',
    pass_filenames = false,
    entry = "go test -timeout 30s -short -v ./..."
  },
  {
    name = "Go Mod Tidy",
    id = "go-mod-tidy",
    language = "system",
    pass_filenames = false,
    entry = "go mod tidy",
    files = '(\.go$|go\.mod|go\.sum)'
  },
  {
    name = "Go Generate",
    id = "go-generate",
    language = "system",
    pass_filenames = false,
    entry = "go generate ./..."
  }
]
